<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#ffffff">

    <title>ZXCAER — Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================================================
           THEME VARIABLES
        ========================================================= */

        :root {
            color-scheme: light;

            --bg: #f7f7f7;
            --surface: #ffffff;
            --surface-2: #fafafa;
            --text: #111111;
            --muted: #777777;
            --muted-2: #999999;
            --border: #e5e5e5;
            --border-strong: #d5d5d5;
            --input: #ffffff;
            --button: #111111;
            --button-text: #ffffff;
            --danger: #d00000;
            --success: #16803c;
            --shadow: 0 15px 50px rgba(0,0,0,.08);
        }

        html[data-theme="dark"] {
            color-scheme: dark;

            --bg: #050505;
            --surface: #0d0d0d;
            --surface-2: #121212;
            --text: #f5f5f5;
            --muted: #9b9b9b;
            --muted-2: #777777;
            --border: #242424;
            --border-strong: #333333;
            --input: #111111;
            --button: #ffffff;
            --button-text: #050505;
            --danger: #ff5a5a;
            --success: #48c77b;
            --shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        html[data-theme="graphite"] {
            color-scheme: dark;

            --bg: #181a1c;
            --surface: #222528;
            --surface-2: #292c30;
            --text: #f3f3f3;
            --muted: #a5a8ac;
            --muted-2: #777b80;
            --border: #363a3f;
            --border-strong: #474c52;
            --input: #25282b;
            --button: #f4f4f4;
            --button-text: #181a1c;
            --danger: #ff6868;
            --success: #55cf86;
            --shadow: 0 20px 60px rgba(0,0,0,.25);
        }


        /* =========================================================
           BASE
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: var(--bg);
            color: var(--text);

            transition:
                background-color .25s ease,
                color .25s ease;
        }

        body {
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        input,
        textarea,
        button {
            color: var(--text);
        }

        ::selection {
            background: var(--text);
            color: var(--bg);
        }


        /* =========================================================
           LOGIN
        ========================================================= */

        #loginScreen {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(20px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));

            background: var(--bg);

            transition:
                background-color .25s ease;
        }

        .login-box {
            width: 100%;
            max-width: 420px;

            background: var(--surface);
            border: 1px solid var(--border);

            padding: 42px;

            box-shadow: var(--shadow);

            transition:
                background-color .25s ease,
                border-color .25s ease;
        }

        .login-logo {
            text-align: center;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -1.5px;
            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 35px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            color: var(--text);
        }

        .field input,
        .field textarea {
            width: 100%;

            border: 1px solid var(--border);
            background: var(--input);
            color: var(--text);

            padding: 13px 14px;

            outline: none;
            border-radius: 0;

            transition:
                border-color .2s,
                background-color .25s,
                color .25s;
        }

        .field input::placeholder,
        .field textarea::placeholder {
            color: var(--muted-2);
        }

        .field textarea {
            min-height: 110px;
            resize: vertical;
        }

        .field input:focus,
        .field textarea:focus {
            border-color: var(--text);
        }

        .main-button {
            width: 100%;

            border: 0;

            background: var(--button);
            color: var(--button-text);

            padding: 15px;

            font-weight: 500;

            transition:
                opacity .2s,
                transform .15s;
        }

        .main-button:hover {
            opacity: .84;
        }

        .main-button:active {
            transform: scale(.99);
        }

        .error {
            color: var(--danger);
            font-size: 13px;
            margin-top: 12px;
            line-height: 1.4;
            display: none;
        }


        /* =========================================================
           ADMIN
        ========================================================= */

        #adminScreen {
            display: none;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .admin-header {
            height: 72px;

            background: var(--surface);
            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 35px;

            position: sticky;
            top: 0;
            z-index: 20;

            transition:
                background-color .25s ease,
                border-color .25s ease;
        }

        .admin-logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .admin-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-email {
            color: var(--muted);
            font-size: 13px;
        }

        .logout-button {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);

            padding: 9px 14px;
            font-size: 12px;

            transition:
                border-color .2s,
                background-color .25s;
        }

        .logout-button:hover {
            border-color: var(--text);
        }


        /* =========================================================
           THEME SWITCHER
        ========================================================= */

        .theme-switcher {
            display: flex;
            align-items: center;
            gap: 4px;

            padding: 4px;

            border: 1px solid var(--border);
            background: var(--surface-2);
        }

        .theme-button {
            border: 0;
            background: transparent;
            color: var(--muted);

            min-height: 32px;
            padding: 6px 10px;

            font-size: 11px;
            font-weight: 500;

            transition:
                background-color .2s,
                color .2s,
                transform .15s;
        }

        .theme-button:hover {
            color: var(--text);
        }

        .theme-button.active {
            background: var(--button);
            color: var(--button-text);
        }

        .theme-button:active {
            transform: scale(.97);
        }


        /* =========================================================
           CONTENT
        ========================================================= */

        .admin-content {
            max-width: 1400px;
            margin: 0 auto;

            padding: 45px 30px 80px;
        }

        .page-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
            margin-bottom: 30px;
        }

        .page-title {
            margin: 0;

            font-size: 30px;
            letter-spacing: -1px;
            font-weight: 600;
        }

        .page-count {
            color: var(--muted);
            font-size: 13px;
            margin-top: 7px;
        }

        .add-button {
            border: 0;

            background: var(--button);
            color: var(--button-text);

            padding: 14px 22px;

            font-weight: 500;

            transition:
                opacity .2s,
                transform .15s;
        }

        .add-button:hover {
            opacity: .82;
        }

        .add-button:active {
            transform: scale(.98);
        }


        /* =========================================================
           PRODUCTS
        ========================================================= */

        .products-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .product-row {
            background: var(--surface);
            border: 1px solid var(--border);

            min-height: 120px;

            display: grid;

            grid-template-columns:
                65px
                110px
                1fr
                130px
                130px
                190px;

            align-items: center;

            gap: 20px;

            padding: 15px 18px;

            transition:
                background-color .25s ease,
                border-color .25s ease,
                transform .15s ease;
        }

        .product-row:hover {
            border-color: var(--border-strong);
        }

        .product-order {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .order-number {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 3px;
        }

        .order-buttons {
            display: flex;
            gap: 3px;
        }

        .order-buttons button {
            width: 28px;
            height: 28px;

            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);

            font-size: 14px;

            transition:
                border-color .2s,
                background-color .2s;
        }

        .order-buttons button:hover {
            border-color: var(--text);
        }

        .product-image {
            width: 90px;
            height: 90px;

            object-fit: cover;

            background: var(--surface-2);

            border: 1px solid var(--border);
        }

        .product-info {
            min-width: 0;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;

            margin-bottom: 7px;

            word-break: break-word;
        }

        .product-description {
            color: var(--muted);

            font-size: 12px;
            line-height: 1.5;

            max-width: 500px;

            word-break: break-word;
        }

        .product-price {
            font-size: 15px;
            font-weight: 600;
        }

        .product-status {
            font-size: 11px;
            font-weight: 500;

            text-transform: uppercase;
        }

        .visible {
            color: var(--success);
        }

        .hidden {
            color: var(--muted-2);
        }

        .product-actions {
            display: flex;
            justify-content: flex-end;

            gap: 6px;
            flex-wrap: wrap;
        }

        .action-button {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);

            padding: 9px 11px;

            font-size: 11px;

            transition:
                border-color .2s,
                background-color .2s;
        }

        .action-button:hover {
            border-color: var(--text);
        }

        .delete-button {
            color: var(--danger);
        }

        .delete-button:hover {
            border-color: var(--danger);
        }

        .empty {
            text-align: center;

            background: var(--surface);
            border: 1px solid var(--border);

            padding: 70px 20px;

            color: var(--muted);
        }


        /* =========================================================
           MODAL
        ========================================================= */

        .modal {
            position: fixed;
            inset: 0;

            background: rgba(0,0,0,.55);

            z-index: 100;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            background: var(--surface);

            width: 100%;
            max-width: 650px;

            max-height: 92vh;
            max-height: 92dvh;

            overflow-y: auto;

            padding: 32px;

            position: relative;

            border: 1px solid var(--border);

            box-shadow: var(--shadow);

            transition:
                background-color .25s,
                border-color .25s;
        }

        .modal-title {
            font-size: 24px;

            margin: 0 0 28px;

            letter-spacing: -.5px;
            font-weight: 600;
        }

        .close-modal {
            position: absolute;

            top: 17px;
            right: 18px;

            border: 0;
            background: transparent;

            color: var(--text);

            font-size: 26px;
            line-height: 1;

            width: 36px;
            height: 36px;
        }

        .form-grid {
            display: grid;

            grid-template-columns: 1fr 180px;

            gap: 15px;
        }

        .upload-area {
            border: 1px dashed var(--border-strong);

            padding: 15px;

            margin-bottom: 18px;

            background: var(--surface-2);
        }

        .upload-area label {
            display: block;

            font-size: 12px;
            font-weight: 500;

            margin-bottom: 10px;
        }

        .upload-area input {
            width: 100%;
            color: var(--text);
        }

        .preview {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-top: 12px;
        }

        .preview-item {
            position: relative;

            aspect-ratio: 1 / 1;

            background: var(--surface-2);

            overflow: hidden;

            border: 1px solid var(--border);
        }

        .preview-item img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .preview-label {
            position: absolute;

            left: 7px;
            bottom: 7px;

            background: rgba(0,0,0,.7);
            color: #fff;

            font-size: 10px;

            padding: 5px 7px;
        }

        .modal-buttons {
            display: flex;

            gap: 10px;

            margin-top: 25px;
        }

        .save-button {
            flex: 1;

            border: 0;

            background: var(--button);
            color: var(--button-text);

            padding: 14px;

            font-weight: 500;
        }

        .cancel-button {
            border: 1px solid var(--border);

            background: var(--surface);
            color: var(--text);

            padding: 14px 20px;
        }

        .save-button:disabled {
            opacity: .5;
            cursor: wait;
        }

        .modal-error {
            display: none;

            margin-top: 12px;

            color: var(--danger);

            font-size: 13px;
            line-height: 1.4;
        }


        /* =========================================================
           LOADING
        ========================================================= */

        .loading {
            text-align: center;

            padding: 70px 20px;

            color: var(--muted);

            background: var(--surface);
            border: 1px solid var(--border);
        }


        /* =========================================================
           TOAST
        ========================================================= */

        .toast {
            position: fixed;

            right: 25px;
            bottom: 25px;

            background: var(--button);
            color: var(--button-text);

            padding: 14px 18px;

            font-size: 13px;

            z-index: 300;

            transform: translateY(100px);
            opacity: 0;

            transition: .3s ease;

            pointer-events: none;

            max-width: 350px;

            box-shadow: var(--shadow);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }


        /* =========================================================
           TABLET
        ========================================================= */

        @media (max-width: 1100px) {

            .product-row {
                grid-template-columns:
                    55px
                    90px
                    1fr
                    110px
                    110px;

                gap: 14px;
            }

            .product-actions {
                grid-column: 1 / -1;
                justify-content: flex-start;
            }
        }


        /* =========================================================
           MOBILE APP STYLE
        ========================================================= */

        @media (max-width: 700px) {

            html,
            body {
                width: 100%;
                min-width: 0;
            }

            body {
                background: var(--bg);
            }

            #loginScreen {
                align-items: flex-start;

                padding:
                    max(24px, env(safe-area-inset-top))
                    18px
                    max(24px, env(safe-area-inset-bottom))
                    18px;
            }

            .login-box {
                margin-top: 12vh;

                padding: 30px 22px;

                border-radius: 18px;

                box-shadow:
                    0 20px 60px rgba(0,0,0,.08);
            }

            html[data-theme="dark"] .login-box,
            html[data-theme="graphite"] .login-box {
                box-shadow:
                    0 20px 60px rgba(0,0,0,.3);
            }

            .login-logo {
                font-size: 27px;
            }

            .login-subtitle {
                margin-bottom: 28px;
            }

            .field input,
            .field textarea {
                min-height: 48px;

                padding: 13px 14px;

                border-radius: 10px;
            }

            .field textarea {
                min-height: 110px;
            }

            .main-button {
                min-height: 50px;
                border-radius: 10px;
            }


            /* HEADER */

            .admin-header {
                height: auto;
                min-height: 64px;

                padding:
                    max(10px, env(safe-area-inset-top))
                    14px
                    10px
                    14px;

                gap: 10px;

                position: sticky;
            }

            .admin-logo {
                font-size: 18px;
            }

            .admin-header-right {
                gap: 6px;
            }

            .admin-email {
                display: none;
            }

            .logout-button {
                min-height: 40px;

                padding: 8px 11px;

                border-radius: 9px;

                font-size: 10px;
            }


            /* THEME */

            .theme-switcher {
                border-radius: 10px;

                padding: 3px;
            }

            .theme-button {
                min-height: 34px;

                padding: 6px 8px;

                border-radius: 7px;

                font-size: 9px;
            }


            /* CONTENT */

            .admin-content {
                width: 100%;

                padding:
                    24px 12px
                    calc(50px + env(safe-area-inset-bottom));
            }

            .page-top {
                align-items: stretch;

                flex-direction: column;

                gap: 14px;

                margin-bottom: 20px;
            }

            .page-title {
                font-size: 26px;

                letter-spacing: -.7px;
            }

            .page-count {
                font-size: 12px;
            }

            .add-button {
                width: 100%;

                min-height: 48px;

                border-radius: 11px;

                font-size: 12px;
            }


            /* PRODUCTS AS APP CARDS */

            .products-list {
                gap: 12px;
            }

            .product-row {
                display: grid;

                grid-template-columns: 78px 1fr;

                grid-template-rows: auto auto auto;

                gap: 12px;

                min-height: 0;

                padding: 13px;

                border-radius: 15px;

                box-shadow:
                    0 5px 20px rgba(0,0,0,.035);
            }

            html[data-theme="dark"] .product-row,
            html[data-theme="graphite"] .product-row {
                box-shadow:
                    0 8px 25px rgba(0,0,0,.15);
            }

            .product-order {
                grid-column: 1;
                grid-row: 1;

                align-items: flex-start;

                width: 78px;
            }

            .order-number {
                display: none;
            }

            .order-buttons {
                position: absolute;

                margin-top: 2px;

                margin-left: 0;

                z-index: 2;
            }

            .order-buttons button {
                width: 28px;
                height: 28px;

                border-radius: 7px;

                background: var(--surface);
            }

            .product-row > div:nth-child(2) {
                grid-column: 1;
                grid-row: 1;

                width: 78px;
                height: 78px;
            }

            .product-image {
                width: 78px;
                height: 78px;

                border-radius: 11px;
            }

            .product-info {
                grid-column: 2;
                grid-row: 1;

                padding-top: 1px;
            }

            .product-name {
                font-size: 14px;

                line-height: 1.25;

                margin-bottom: 5px;
            }

            .product-description {
                font-size: 11px;

                line-height: 1.4;

                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;

                overflow: hidden;
            }

            .product-price {
                grid-column: 2;
                grid-row: 2;

                font-size: 14px;

                margin-top: -3px;
            }

            .product-status {
                grid-column: 1 / -1;
                grid-row: 2;

                align-self: center;

                justify-self: end;

                margin-top: 0;

                font-size: 9px;
            }

            .product-actions {
                grid-column: 1 / -1;
                grid-row: 3;

                width: 100%;

                display: grid;

                grid-template-columns:
                    1fr
                    1fr
                    1fr;

                gap: 6px;

                padding-top: 2px;
            }

            .action-button {
                width: 100%;

                min-height: 39px;

                padding: 7px 4px;

                border-radius: 9px;

                font-size: 9px;

                white-space: nowrap;
            }


            /* EMPTY */

            .empty,
            .loading {
                border-radius: 14px;

                padding: 55px 18px;

                font-size: 13px;
            }


            /* MODAL */

            .modal {
                padding: 0;

                align-items: flex-end;

                background: rgba(0,0,0,.55);
            }

            .modal-box {
                width: 100%;

                max-width: none;

                max-height: 94vh;
                max-height: 94dvh;

                padding:
                    25px 16px
                    calc(20px + env(safe-area-inset-bottom));

                border-radius: 20px 20px 0 0;

                border: 1px solid var(--border);
                border-bottom: 0;
            }

            .modal-title {
                font-size: 21px;

                margin-bottom: 22px;

                padding-right: 40px;
            }

            .close-modal {
                top: 14px;
                right: 12px;

                width: 42px;
                height: 42px;

                font-size: 28px;

                border-radius: 50%;

                background: var(--surface-2);
            }

            .form-grid {
                grid-template-columns: 1fr;

                gap: 0;
            }

            .upload-area {
                padding: 13px;

                border-radius: 12px;
            }

            .preview {
                gap: 8px;
            }

            .modal-buttons {
                flex-direction: column;

                gap: 8px;

                margin-top: 20px;
            }

            .save-button,
            .cancel-button {
                width: 100%;

                min-height: 48px;

                border-radius: 10px;
            }


            /* TOAST */

            .toast {
                left: 12px;
                right: 12px;

                bottom:
                    calc(12px + env(safe-area-inset-bottom));

                max-width: none;

                border-radius: 12px;

                padding: 14px 16px;
            }
        }


        /* =========================================================
           SMALL PHONES
        ========================================================= */

        @media (max-width: 390px) {

            .admin-header {
                padding-left: 10px;
                padding-right: 10px;
            }

            .admin-logo {
                font-size: 16px;
            }

            .theme-button {
                padding-left: 6px;
                padding-right: 6px;

                font-size: 8px;
            }

            .logout-button {
                padding-left: 8px;
                padding-right: 8px;

                font-size: 9px;
            }

<script>
/* ============================================================
   SUPABASE
============================================================ */

const SUPABASE_URL =
    "https://gxkmnkphocqvlhnerkix.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_B3hq0yrXvptyr4KT7dCczg_5VVVeup_";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ============================================================
   THEME
============================================================ */

const THEME_STORAGE_KEY =
    "zxcaer-admin-theme";

const themeButtons =
    document.querySelectorAll(".theme-button");

function applyTheme(theme) {

    const allowedThemes = [
        "light",
        "dark",
        "graphite"
    ];

    if (!allowedThemes.includes(theme)) {
        theme = "light";
    }

    document.documentElement
        .setAttribute(
            "data-theme",
            theme
        );

    localStorage.setItem(
        THEME_STORAGE_KEY,
        theme
    );

    themeButtons.forEach(button => {

        button.classList.toggle(
            "active",
            button.dataset.themeValue === theme
        );

    });

    const themeColors = {
        light: "#ffffff",
        dark: "#050505",
        graphite: "#181a1c"
    };

    const themeColor =
        document.querySelector(
            'meta[name="theme-color"]'
        );

    if (themeColor) {
        themeColor.setAttribute(
            "content",
            themeColors[theme]
        );
    }
}


function loadSavedTheme() {

    const savedTheme =
        localStorage.getItem(
            THEME_STORAGE_KEY
        ) || "light";

    applyTheme(savedTheme);
}


themeButtons.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            applyTheme(
                button.dataset.themeValue
            );

        }
    );

});


loadSavedTheme();


/* ============================================================
   ELEMENTS
============================================================ */

const loginScreen =
    document.getElementById("loginScreen");

const adminScreen =
    document.getElementById("adminScreen");

const loginForm =
    document.getElementById("loginForm");

const loginEmail =
    document.getElementById("loginEmail");

const loginPassword =
    document.getElementById("loginPassword");

const loginButton =
    document.getElementById("loginButton");

const loginError =
    document.getElementById("loginError");

const adminEmail =
    document.getElementById("adminEmail");

const logoutButton =
    document.getElementById("logoutButton");

const productsList =
    document.getElementById("productsList");

const pageCount =
    document.getElementById("pageCount");

const addProductButton =
    document.getElementById("addProductButton");

const productModal =
    document.getElementById("productModal");

const closeModal =
    document.getElementById("closeModal");

const cancelModal =
    document.getElementById("cancelModal");

const modalTitle =
    document.getElementById("modalTitle");

const productForm =
    document.getElementById("productForm");

const productName =
    document.getElementById("productName");

const productPrice =
    document.getElementById("productPrice");

const productDescription =
    document.getElementById("productDescription");

const frontFile =
    document.getElementById("frontFile");

const backFile =
    document.getElementById("backFile");

const frontPreview =
    document.getElementById("frontPreview");

const backPreview =
    document.getElementById("backPreview");

const saveProductButton =
    document.getElementById("saveProductButton");

const modalError =
    document.getElementById("modalError");

const toast =
    document.getElementById("toast");


/* ============================================================
   STATE
============================================================ */

let products = [];

let editingProductId = null;


/* ============================================================
   HELPERS
============================================================ */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 3000);
}


function showLoginError(message) {

    loginError.textContent = message;
    loginError.style.display = "block";
}


function showModalError(message) {

    modalError.textContent = message;
    modalError.style.display = "block";
}


function clearModalError() {

    modalError.textContent = "";
    modalError.style.display = "none";
}


function getImageUrl(path) {

    if (!path) {
        return "";
    }

    if (
        path.startsWith("http://") ||
        path.startsWith("https://")
    ) {
        return path;
    }

    return new URL(
        path,
        window.location.href
    ).href;
}


function formatPrice(price) {

    return Number(price || 0)
        .toLocaleString("uk-UA") + " ₴";
}


/* ============================================================
   AUTH
============================================================ */

async function checkSession() {

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();

    if (error) {

        console.error(error);

        showLogin();

        return;
    }

    if (data.session) {

        showAdmin(
            data.session.user
        );

    } else {

        showLogin();

    }
}


function showLogin() {

    loginScreen.style.display = "flex";

    adminScreen.style.display = "none";
}


async function showAdmin(user) {

    loginScreen.style.display = "none";

    adminScreen.style.display = "block";

    adminEmail.textContent =
        user.email || "";

    await loadProducts();
}


/* ============================================================
   LOGIN
============================================================ */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        loginError.style.display = "none";

        const email =
            loginEmail.value.trim();

        const password =
            loginPassword.value;

        loginButton.disabled = true;

        loginButton.textContent =
            "ВХОД...";

        const {
            data,
            error
        } = await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

        loginButton.disabled = false;

        loginButton.textContent =
            "ВОЙТИ";

        if (error) {

            showLoginError(
                "Неверный email или пароль."
            );

            return;
        }

        showAdmin(data.user);

    }
);


/* ============================================================
   LOGOUT
============================================================ */

logoutButton.addEventListener(
    "click",
    async function() {

        await supabaseClient.auth.signOut();

        products = [];

        showLogin();

    }
);


/* ============================================================
   LOAD PRODUCTS
============================================================ */

async function loadProducts() {

    productsList.innerHTML = `
        <div class="loading">
            Загрузка товаров...
        </div>
    `;

    const {
        data,
        error
    } = await supabaseClient
        .from("products")
        .select("*")
        .order("sort_order", {
            ascending: true
        });

    if (error) {

        console.error(error);

        productsList.innerHTML = `
            <div class="empty">
                Не удалось загрузить товары.<br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

        return;
    }

    products = data || [];

    renderProducts();
}


/* ============================================================
   RENDER PRODUCTS
============================================================ */

function renderProducts() {

    pageCount.textContent =
        `Всего товаров: ${products.length}`;

    if (!products.length) {

        productsList.innerHTML = `
            <div class="empty">
                Товаров пока нет.
            </div>
        `;

        return;
    }


    productsList.innerHTML =
        products.map((product, index) => {

            const image =
                getImageUrl(
                    product.front_image
                );

            const statusClass =
                product.is_visible
                    ? "visible"
                    : "hidden";

            const statusText =
                product.is_visible
                    ? "Опубликован"
                    : "Скрыт";


            return `

                <div
                    class="product-row"
                    data-id="${escapeHtml(product.id)}"
                >

                    <div class="product-order">

                        <div class="order-number">
                            #${index + 1}
                        </div>

                        <div class="order-buttons">

                            <button
                                type="button"
                                title="Выше"
                                onclick="moveProduct('${product.id}', -1)"
                            >
                                ↑
                            </button>

                            <button
                                type="button"
                                title="Ниже"
                                onclick="moveProduct('${product.id}', 1)"
                            >
                                ↓
                            </button>

                        </div>

                    </div>


                    <div>

                        ${
                            image
                                ? `
                                    <img
                                        class="product-image"
                                        src="${escapeHtml(image)}"
                                        alt=""
                                    >
                                  `
                                : `
                                    <div
                                        class="product-image"
                                    ></div>
                                  `
                        }

                    </div>


                    <div class="product-info">

                        <div class="product-name">
                            ${escapeHtml(product.name)}
                        </div>

                        <div class="product-description">
                            ${escapeHtml(product.description || "Без описания")}
                        </div>

                    </div>


                    <div class="product-price">
                        ${formatPrice(product.price)}
                    </div>


                    <div
                        class="product-status ${statusClass}"
                    >
                        ${statusText}
                    </div>


                    <div class="product-actions">

                        <button
                            type="button"
                            class="action-button"
                            onclick="editProduct('${product.id}')"
                        >
                            ✏️ ИЗМЕНИТЬ
                        </button>

                        <button
                            type="button"
                            class="action-button"
                            onclick="toggleVisibility('${product.id}')"
                        >
                            ${
                                product.is_visible
                                    ? "👁️ СКРЫТЬ"
                                    : "👁️ ПОКАЗАТЬ"
                            }
                        </button>

                        <button
                            type="button"
                            class="action-button delete-button"
                            onclick="deleteProduct('${product.id}')"
                        >
                            🗑️ УДАЛИТЬ
                        </button>

                    </div>

                </div>

            `;

        }).join("");
}


/* ============================================================
   ADD PRODUCT
============================================================ */

addProductButton.addEventListener(
    "click",
    function() {

        editingProductId = null;

        modalTitle.textContent =
            "Добавить товар";

        productForm.reset();

        frontPreview.src = "";

        backPreview.src = "";

        clearModalError();

        productModal.classList.add("active");

    }
);


/* ============================================================
   EDIT PRODUCT
============================================================ */

window.editProduct = function(id) {

    const product =
        products.find(
            item => String(item.id) === String(id)
        );

    if (!product) {
        return;
    }

    editingProductId =
        product.id;

    modalTitle.textContent =
        "Редактировать товар";

    productName.value =
        product.name || "";

    productPrice.value =
        product.price || "";

    productDescription.value =
        product.description || "";

    frontFile.value = "";

    backFile.value = "";

    frontPreview.src =
        getImageUrl(product.front_image);

    backPreview.src =
        getImageUrl(product.back_image);

    clearModalError();

    productModal.classList.add("active");
};


/* ============================================================
   CLOSE MODAL
============================================================ */

function closeProductModal() {

    productModal.classList.remove("active");

    editingProductId = null;

    productForm.reset();

    frontPreview.src = "";

    backPreview.src = "";

    clearModalError();
}


closeModal.addEventListener(
    "click",
    closeProductModal
);


cancelModal.addEventListener(
    "click",
    closeProductModal
);


productModal.addEventListener(
    "click",
    function(event) {

        if (event.target === productModal) {
            closeProductModal();
        }

    }
);


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" &&
            productModal.classList.contains("active")
        ) {
            closeProductModal();
        }

    }
);


/* ============================================================
   IMAGE PREVIEWS
============================================================ */

frontFile.addEventListener(
    "change",
    function() {

        const file =
            frontFile.files[0];

        if (!file) {
            return;
        }

        frontPreview.src =
            URL.createObjectURL(file);

    }
);


backFile.addEventListener(
    "change",
    function() {

        const file =
            backFile.files[0];

        if (!file) {
            return;
        }

        backPreview.src =
            URL.createObjectURL(file);

    }
);


/* ============================================================
   UPLOAD IMAGE
============================================================ */

async function uploadImage(file) {

    if (!file) {
        return null;
    }

    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();

    const fileName =
        `${Date.now()}-${crypto.randomUUID()}.${extension}`;

    const filePath =
        `products/${fileName}`;


    const {
        error
    } = await supabaseClient
        .storage
        .from("product-images")
        .upload(
            filePath,
            file,
            {
                cacheControl: "3600",
                upsert: false
            }
        );

    if (error) {
        throw error;
    }


    const {
        data
    } = supabaseClient
        .storage
        .from("product-images")
        .getPublicUrl(filePath);


    return data.publicUrl;
}


/* ============================================================
   SAVE PRODUCT
============================================================ */

productForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        clearModalError();

        const name =
            productName.value.trim();

        const price =
            Number(productPrice.value);

        const description =
            productDescription.value.trim();


        if (!name) {

            showModalError(
                "Введите название товара."
            );

            return;
        }


        if (!Number.isFinite(price) || price < 0) {

            showModalError(
                "Введите правильную цену."
            );

            return;
        }


        saveProductButton.disabled = true;

        saveProductButton.textContent =
            "СОХРАНЕНИЕ...";


        try {

            let frontImage = null;
            let backImage = null;


            if (frontFile.files[0]) {

                frontImage =
                    await uploadImage(
                        frontFile.files[0]
                    );
            }


            if (backFile.files[0]) {

                backImage =
                    await uploadImage(
                        backFile.files[0]
                    );
            }


            /* EDIT */

            if (editingProductId) {

                const updateData = {

                    name,

                    price,

                    description

                };


                if (frontImage) {

                    updateData.front_image =
                        frontImage;

                }


                if (backImage) {

                    updateData.back_image =
                        backImage;

                }


                const {
                    error
                } = await supabaseClient
                    .from("products")
                    .update(updateData)
                    .eq(
                        "id",
                        editingProductId
                    );


                if (error) {
                    throw error;
                }


                showToast(
                    "Товар успешно изменён."
                );

            }


            /* ADD */

            else {

                const maxOrder =
                    products.length
                        ? Math.max(
                            ...products.map(
                                item =>
                                    Number(item.sort_order) || 0
                            )
                          )
                        : 0;


                const insertData = {

                    name,

                    price,

                    description,

                    front_image:
                        frontImage || "",

                    back_image:
                        backImage || "",

                    sort_order:
                        maxOrder + 1,

                    is_visible:
                        true

                };


                const {
                    error
                } = await supabaseClient
                    .from("products")
                    .insert(insertData);


                if (error) {
                    throw error;
                }


                showToast(
                    "Товар успешно добавлен."
                );

            }


            closeProductModal();

            await loadProducts();

        }


        catch (error) {

            console.error(error);

            showModalError(
                error.message ||
                "Произошла ошибка."
            );

        }


        finally {

            saveProductButton.disabled = false;

            saveProductButton.textContent =
                "СОХРАНИТЬ";

        }

    }
);


/* ============================================================
   HIDE / SHOW
============================================================ */

window.toggleVisibility =
    async function(id) {

        const product =
            products.find(
                item =>
                    String(item.id) ===
                    String(id)
            );

        if (!product) {
            return;
        }


        const {
            error
        } = await supabaseClient
            .from("products")
            .update({
                is_visible:
                    !product.is_visible
            })
            .eq(
                "id",
                product.id
            );


        if (error) {

            alert(
                "Ошибка: " +
                error.message
            );

            return;
        }


        showToast(
            product.is_visible
                ? "Товар скрыт."
                : "Товар опубликован."
        );


        await loadProducts();

    };


/* ============================================================
   DELETE
============================================================ */

window.deleteProduct =
    async function(id) {

        const product =
            products.find(
                item =>
                    String(item.id) ===
                    String(id)
            );

        if (!product) {
            return;
        }


        const confirmed =
            confirm(
                `Удалить товар "${product.name}"?`
            );


        if (!confirmed) {
            return;
        }


        const {
            error
        } = await supabaseClient
            .from("products")
            .delete()
            .eq(
                "id",
                product.id
            );


        if (error) {

            alert(
                "Ошибка удаления: " +
                error.message
            );

            return;
        }


        showToast(
            "Товар удалён."
        );


        await loadProducts();

    };


/* ============================================================
   CHANGE ORDER
============================================================ */

window.moveProduct =
    async function(id, direction) {

        const index =
            products.findIndex(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if (index === -1) {
            return;
        }


        const newIndex =
            index + direction;


        if (
            newIndex < 0 ||
            newIndex >= products.length
        ) {
            return;
        }


        const current =
            products[index];

        const target =
            products[newIndex];


        const currentOrder =
            current.sort_order;

        const targetOrder =
            target.sort_order;


        const firstUpdate =
            await supabaseClient
                .from("products")
                .update({
                    sort_order:
                        targetOrder
                })
                .eq(
                    "id",
                    current.id
                );


        if (firstUpdate.error) {

            alert(
                "Ошибка изменения порядка: " +
                firstUpdate.error.message
            );

            return;
        }


        const secondUpdate =
            await supabaseClient
                .from("products")
                .update({
                    sort_order:
                        currentOrder
                })
                .eq(
                    "id",
                    target.id
                );


        if (secondUpdate.error) {

            alert(
                "Ошибка изменения порядка: " +
                secondUpdate.error.message
            );

            return;
        }


        await loadProducts();


        showToast(
            "Порядок товаров изменён."
        );

    };
