<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZXCAER — Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f7;
            color: #111;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #fff;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid #e5e5e5;
            padding: 42px;
        }

        .login-logo {
            text-align: center;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -1.5px;
            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 35px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .field input,
        .field textarea {
            width: 100%;
            border: 1px solid #ddd;
            background: #fff;
            padding: 13px 14px;
            outline: none;
            border-radius: 0;
            transition: border-color .2s;
        }

        .field textarea {
            min-height: 110px;
            resize: vertical;
        }

        .field input:focus,
        .field textarea:focus {
            border-color: #111;
        }

        .main-button {
            width: 100%;
            border: 0;
            background: #111;
            color: #fff;
            padding: 15px;
            font-weight: 600;
            transition: opacity .2s;
        }

        .main-button:hover {
            opacity: .82;
        }

        .error {
            color: #d00000;
            font-size: 13px;
            margin-top: 12px;
            line-height: 1.4;
            display: none;
        }

        /* =========================
           ADMIN
        ========================= */

        #adminScreen {
            display: none;
            min-height: 100vh;
        }

        .admin-header {
            height: 72px;
            background: #fff;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .admin-logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .admin-header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .admin-email {
            color: #777;
            font-size: 13px;
        }

        .logout-button {
            border: 1px solid #ddd;
            background: #fff;
            padding: 9px 14px;
            font-size: 12px;
        }

        .logout-button:hover {
            border-color: #111;
        }

        .admin-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 45px 30px 80px;
        }

        .page-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-title {
            margin: 0;
            font-size: 30px;
            letter-spacing: -1px;
        }

        .page-count {
            color: #777;
            font-size: 13px;
            margin-top: 7px;
        }

        .add-button {
            border: 0;
            background: #111;
            color: #fff;
            padding: 14px 22px;
            font-weight: 600;
        }

        .add-button:hover {
            opacity: .82;
        }

        /* =========================
           PRODUCTS
        ========================= */

        .products-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .product-row {
            background: #fff;
            border: 1px solid #e5e5e5;
            min-height: 120px;
            display: grid;
            grid-template-columns: 65px 110px 1fr 130px 130px 190px;
            align-items: center;
            gap: 20px;
            padding: 15px 18px;
        }

        .product-order {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .order-number {
            font-size: 12px;
            color: #888;
            margin-bottom: 3px;
        }

        .order-buttons {
            display: flex;
            gap: 3px;
        }

        .order-buttons button {
            width: 28px;
            height: 28px;
            border: 1px solid #ddd;
            background: #fff;
            font-size: 14px;
        }

        .order-buttons button:hover {
            border-color: #111;
        }

        .product-image {
            width: 90px;
            height: 90px;
            object-fit: cover;
            background: #f4f4f4;
        }

        .product-info {
            min-width: 0;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 7px;
            word-break: break-word;
        }

        .product-description {
            color: #777;
            font-size: 12px;
            line-height: 1.5;
            max-width: 500px;
        }

        .product-price {
            font-size: 15px;
            font-weight: 600;
        }

        .product-status {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .visible {
            color: #16803c;
        }

        .hidden {
            color: #999;
        }

        .product-actions {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            flex-wrap: wrap;
        }

        .action-button {
            border: 1px solid #ddd;
            background: #fff;
            padding: 9px 11px;
            font-size: 11px;
        }

        .action-button:hover {
            border-color: #111;
        }

        .delete-button {
            color: #d00000;
        }

        .delete-button:hover {
            border-color: #d00000;
        }

        .empty {
            text-align: center;
            background: #fff;
            border: 1px solid #e5e5e5;
            padding: 70px 20px;
            color: #777;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            background: #fff;
            width: 100%;
            max-width: 650px;
            max-height: 92vh;
            overflow-y: auto;
            padding: 32px;
            position: relative;
        }

        .modal-title {
            font-size: 24px;
            margin: 0 0 28px;
            letter-spacing: -.5px;
        }

        .close-modal {
            position: absolute;
            top: 17px;
            right: 18px;
            border: 0;
            background: transparent;
            font-size: 26px;
            line-height: 1;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 15px;
        }

        .upload-area {
            border: 1px dashed #ccc;
            padding: 15px;
            margin-bottom: 18px;
        }

        .upload-area label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .upload-area input {
            width: 100%;
        }

        .preview {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .preview-item {
            position: relative;
            aspect-ratio: 1 / 1;
            background: #f4f4f4;
            overflow: hidden;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-label {
            position: absolute;
            left: 7px;
            bottom: 7px;
            background: rgba(0,0,0,.7);
            color: #fff;
            font-size: 10px;
            padding: 5px 7px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .save-button {
            flex: 1;
            border: 0;
            background: #111;
            color: #fff;
            padding: 14px;
            font-weight: 600;
        }

        .cancel-button {
            border: 1px solid #ddd;
            background: #fff;
            padding: 14px 20px;
        }

        .save-button:disabled {
            opacity: .5;
            cursor: wait;
        }

        .modal-error {
            display: none;
            margin-top: 12px;
            color: #d00000;
            font-size: 13px;
            line-height: 1.4;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            text-align: center;
            padding: 70px 20px;
            color: #777;
            background: #fff;
            border: 1px solid #e5e5e5;
        }

        /* =========================
           TOAST
        ========================= */

        .toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            background: #111;
            color: #fff;
            padding: 14px 18px;
            font-size: 13px;
            z-index: 300;
            transform: translateY(100px);
            opacity: 0;
            transition: .3s ease;
            pointer-events: none;
            max-width: 350px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .admin-header {
                padding: 0 18px;
            }

            .admin-email {
                display: none;
            }

            .admin-content {
                padding: 30px 15px 60px;
            }

            .product-row {
                grid-template-columns: 55px 80px 1fr;
                gap: 12px;
                padding: 12px;
            }

            .product-image {
                width: 75px;
                height: 75px;
            }

            .product-price {
                margin-top: 10px;
            }

            .product-status {
                margin-top: 8px;
            }

            .product-actions {
                grid-column: 1 / -1;
                justify-content: flex-start;
            }
        }

        @media (max-width: 600px) {

            .admin-header {
                height: 62px;
            }

            .admin-logo {
                font-size: 18px;
            }

            .page-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .page-title {
                font-size: 25px;
            }

            .add-button {
                width: 100%;
            }

            .modal {
                padding: 0;
                align-items: flex-end;
            }

            .modal-box {
                max-height: 95vh;
                padding: 25px 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .modal-buttons {
                flex-direction: column;
            }

            .cancel-button {
                width: 100%;
            }

            .toast {
                left: 15px;
                right: 15px;
                bottom: 15px;
                max-width: none;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section id="loginScreen">

    <div class="login-box">

        <div class="login-logo">
            ZXCAER
        </div>

        <div class="login-subtitle">
            Панель управления товарами
        </div>

        <form id="loginForm">

            <div class="field">
                <label>Email</label>

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="Введите email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label>Пароль</label>

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Введите пароль"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="main-button"
                id="loginButton"
            >
                ВОЙТИ
            </button>

            <div
                class="error"
                id="loginError"
            ></div>

        </form>

    </div>

</section>


<!-- =========================
     ADMIN
========================= -->

<section id="adminScreen">

    <header class="admin-header">

        <div class="admin-logo">
            ZXCAER
        </div>

        <div class="admin-header-right">

            <div
                class="admin-email"
                id="adminEmail"
            ></div>

            <button
                class="logout-button"
                id="logoutButton"
            >
                ВЫЙТИ
            </button>

        </div>

    </header>


    <main class="admin-content">

        <div class="page-top">

            <div>

                <h1 class="page-title">
                    Товары
                </h1>

                <div
                    class="page-count"
                    id="pageCount"
                >
                    Загрузка...
                </div>

            </div>

            <button
                class="add-button"
                id="addProductButton"
            >
                ＋ ДОБАВИТЬ ТОВАР
            </button>

        </div>


        <div
            class="products-list"
            id="productsList"
        >

            <div class="loading">
                Загрузка товаров...
            </div>

        </div>

    </main>

</section>


<!-- =========================
     PRODUCT MODAL
========================= -->

<div
    class="modal"
    id="productModal"
>

    <div class="modal-box">

        <button
            class="close-modal"
            id="closeModal"
            type="button"
        >
            ×
        </button>

        <h2
            class="modal-title"
            id="modalTitle"
        >
            Добавить товар
        </h2>


        <form id="productForm">

            <div class="form-grid">

                <div class="field">

                    <label>
                        Название
                    </label>

                    <input
                        id="productName"
                        type="text"
                        placeholder="Например: 🩸 ZXCAER - ZIP"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Цена ₴
                    </label>

                    <input
                        id="productPrice"
                        type="number"
                        min="0"
                        step="1"
                        placeholder="2300"
                        required
                    >

                </div>

            </div>


            <div class="field">

                <label>
                    Описание
                </label>

                <textarea
                    id="productDescription"
                    placeholder="Описание товара..."
                ></textarea>

            </div>


            <!-- FRONT -->

            <div class="upload-area">

                <label>
                    ФОТО ПЕРЕДА
                </label>

                <input
                    id="frontFile"
                    type="file"
                    accept="image/jpeg,image/png,image/webp,image/jpg"
                >

                <div class="preview">

                    <div class="preview-item">

                        <img
                            id="frontPreview"
                            src=""
                            alt=""
                        >

                        <div class="preview-label">
                            ПЕРЕД
                        </div>

                    </div>

                </div>

            </div>


            <!-- BACK -->

            <div class="upload-area">

                <label>
                    ФОТО СПИНЫ
                </label>

                <input
                    id="backFile"
                    type="file"
                    accept="image/jpeg,image/png,image/webp,image/jpg"
                >

                <div class="preview">

                    <div class="preview-item">

                        <img
                            id="backPreview"
                            src=""
                            alt=""
                        >

                        <div class="preview-label">
                            СПИНА
                        </div>

                    </div>

                </div>

            </div>


            <div
                class="modal-error"
                id="modalError"
            ></div>


            <div class="modal-buttons">

                <button
                    type="button"
                    class="cancel-button"
                    id="cancelModal"
                >
                    ОТМЕНА
                </button>

                <button
                    type="submit"
                    class="save-button"
                    id="saveProductButton"
                >
                    СОХРАНИТЬ
                </button>

            </div>

        </form>

    </div>

</div>


<div
    class="toast"
    id="toast"
></div>


<script>
/* ============================================================
   SUPABASE
============================================================ */

const SUPABASE_URL =
    "https://gxkmnkphocqvlhnerkix.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_B3hq0yrXvptyr4KT7dCczg_5VVVeup_";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ============================================================
   ELEMENTS
============================================================ */

const loginScreen =
    document.getElementById("loginScreen");

const adminScreen =
    document.getElementById("adminScreen");

const loginForm =
    document.getElementById("loginForm");

const loginEmail =
    document.getElementById("loginEmail");

const loginPassword =
    document.getElementById("loginPassword");

const loginButton =
    document.getElementById("loginButton");

const loginError =
    document.getElementById("loginError");

const adminEmail =
    document.getElementById("adminEmail");

const logoutButton =
    document.getElementById("logoutButton");

const productsList =
    document.getElementById("productsList");

const pageCount =
    document.getElementById("pageCount");

const addProductButton =
    document.getElementById("addProductButton");

const productModal =
    document.getElementById("productModal");

const closeModal =
    document.getElementById("closeModal");

const cancelModal =
    document.getElementById("cancelModal");

const modalTitle =
    document.getElementById("modalTitle");

const productForm =
    document.getElementById("productForm");

const productName =
    document.getElementById("productName");

const productPrice =
    document.getElementById("productPrice");

const productDescription =
    document.getElementById("productDescription");

const frontFile =
    document.getElementById("frontFile");

const backFile =
    document.getElementById("backFile");

const frontPreview =
    document.getElementById("frontPreview");

const backPreview =
    document.getElementById("backPreview");

const saveProductButton =
    document.getElementById("saveProductButton");

const modalError =
    document.getElementById("modalError");

const toast =
    document.getElementById("toast");


/* ============================================================
   STATE
============================================================ */

let products = [];

let editingProductId = null;


/* ============================================================
   HELPERS
============================================================ */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 3000);
}


function showLoginError(message) {

    loginError.textContent = message;
    loginError.style.display = "block";
}


function showModalError(message) {

    modalError.textContent = message;
    modalError.style.display = "block";
}


function clearModalError() {

    modalError.textContent = "";
    modalError.style.display = "none";
}


function getImageUrl(path) {

    if (!path) {
        return "";
    }

    /*
       Старые фотографии находятся в папке images
       самого сайта.

       Новые фотографии будут храниться
       в Supabase Storage.
    */

    if (
        path.startsWith("http://") ||
        path.startsWith("https://")
    ) {
        return path;
    }

    return new URL(
        path,
        window.location.href
    ).href;
}


function formatPrice(price) {

    return Number(price || 0)
        .toLocaleString("uk-UA") + " ₴";
}


/* ============================================================
   AUTH
============================================================ */

async function checkSession() {

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();

    if (error) {

        console.error(error);

        showLogin();

        return;
    }

    if (data.session) {

        showAdmin(
            data.session.user
        );

    } else {

        showLogin();
    }
}


function showLogin() {

    loginScreen.style.display = "flex";

    adminScreen.style.display = "none";
}


async function showAdmin(user) {

    loginScreen.style.display = "none";

    adminScreen.style.display = "block";

    adminEmail.textContent =
        user.email || "";

    await loadProducts();
}


/* ============================================================
   LOGIN
============================================================ */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        loginError.style.display = "none";

        const email =
            loginEmail.value.trim();

        const password =
            loginPassword.value;

        loginButton.disabled = true;

        loginButton.textContent =
            "ВХОД...";

        const {
            data,
            error
        } = await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

        loginButton.disabled = false;

        loginButton.textContent =
            "ВОЙТИ";

        if (error) {

            showLoginError(
                "Неверный email или пароль."
            );

            return;
        }

        showAdmin(data.user);
    }
);


/* ============================================================
   LOGOUT
============================================================ */

logoutButton.addEventListener(
    "click",
    async function() {

        await supabaseClient.auth.signOut();

        products = [];

        showLogin();
    }
);


/* ============================================================
   LOAD PRODUCTS
============================================================ */

async function loadProducts() {

    productsList.innerHTML = `
        <div class="loading">
            Загрузка товаров...
        </div>
    `;

    const {
        data,
        error
    } = await supabaseClient
        .from("products")
        .select("*")
        .order("sort_order", {
            ascending: true
        });

    if (error) {

        console.error(error);

        productsList.innerHTML = `
            <div class="empty">
                Не удалось загрузить товары.<br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

        return;
    }

    products = data || [];

    renderProducts();
}


/* ============================================================
   RENDER PRODUCTS
============================================================ */

function renderProducts() {

    pageCount.textContent =
        `Всего товаров: ${products.length}`;

    if (!products.length) {

        productsList.innerHTML = `
            <div class="empty">
                Товаров пока нет.
            </div>
        `;

        return;
    }


    productsList.innerHTML =
        products.map((product, index) => {

            const image =
                getImageUrl(
                    product.front_image
                );

            const statusClass =
                product.is_visible
                    ? "visible"
                    : "hidden";

            const statusText =
                product.is_visible
                    ? "Опубликован"
                    : "Скрыт";


            return `

                <div
                    class="product-row"
                    data-id="${escapeHtml(product.id)}"
                >

                    <div class="product-order">

                        <div class="order-number">
                            #${index + 1}
                        </div>

                        <div class="order-buttons">

                            <button
                                type="button"
                                title="Выше"
                                onclick="moveProduct('${product.id}', -1)"
                            >
                                ↑
                            </button>

                            <button
                                type="button"
                                title="Ниже"
                                onclick="moveProduct('${product.id}', 1)"
                            >
                                ↓
                            </button>

                        </div>

                    </div>


                    <div>

                        ${
                            image
                                ? `
                                    <img
                                        class="product-image"
                                        src="${escapeHtml(image)}"
                                        alt=""
                                    >
                                  `
                                : `
                                    <div
                                        class="product-image"
                                    ></div>
                                  `
                        }

                    </div>


                    <div class="product-info">

                        <div class="product-name">
                            ${escapeHtml(product.name)}
                        </div>

                        <div class="product-description">
                            ${escapeHtml(product.description || "Без описания")}
                        </div>

                    </div>


                    <div class="product-price">
                        ${formatPrice(product.price)}
                    </div>


                    <div
                        class="product-status ${statusClass}"
                    >
                        ${statusText}
                    </div>


                    <div class="product-actions">

                        <button
                            type="button"
                            class="action-button"
                            onclick="editProduct('${product.id}')"
                        >
                            ✏️ ИЗМЕНИТЬ
                        </button>

                        <button
                            type="button"
                            class="action-button"
                            onclick="toggleVisibility('${product.id}')"
                        >
                            ${
                                product.is_visible
                                    ? "👁️ СКРЫТЬ"
                                    : "👁️ ПОКАЗАТЬ"
                            }
                        </button>

                        <button
                            type="button"
                            class="action-button delete-button"
                            onclick="deleteProduct('${product.id}')"
                        >
                            🗑️ УДАЛИТЬ
                        </button>

                    </div>

                </div>

            `;

        }).join("");
}


/* ============================================================
   ADD PRODUCT
============================================================ */

addProductButton.addEventListener(
    "click",
    function() {

        editingProductId = null;

        modalTitle.textContent =
            "Добавить товар";

        productForm.reset();

        frontPreview.src = "";

        backPreview.src = "";

        clearModalError();

        productModal.classList.add("active");
    }
);


/* ============================================================
   EDIT PRODUCT
============================================================ */

window.editProduct = function(id) {

    const product =
        products.find(
            item => String(item.id) === String(id)
        );

    if (!product) {
        return;
    }

    editingProductId =
        product.id;

    modalTitle.textContent =
        "Редактировать товар";

    productName.value =
        product.name || "";

    productPrice.value =
        product.price || "";

    productDescription.value =
        product.description || "";

    frontFile.value = "";

    backFile.value = "";

    frontPreview.src =
        getImageUrl(product.front_image);

    backPreview.src =
        getImageUrl(product.back_image);

    clearModalError();

    productModal.classList.add("active");
};


/* ============================================================
   CLOSE MODAL
============================================================ */

function closeProductModal() {

    productModal.classList.remove("active");

    editingProductId = null;

    productForm.reset();

    frontPreview.src = "";

    backPreview.src = "";

    clearModalError();
}


closeModal.addEventListener(
    "click",
    closeProductModal
);


cancelModal.addEventListener(
    "click",
    closeProductModal
);


productModal.addEventListener(
    "click",
    function(event) {

        if (event.target === productModal) {
            closeProductModal();
        }
    }
);


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" &&
            productModal.classList.contains("active")
        ) {
            closeProductModal();
        }
    }
);


/* ============================================================
   IMAGE PREVIEWS
============================================================ */

frontFile.addEventListener(
    "change",
    function() {

        const file =
            frontFile.files[0];

        if (!file) {
            return;
        }

        frontPreview.src =
            URL.createObjectURL(file);
    }
);


backFile.addEventListener(
    "change",
    function() {

        const file =
            backFile.files[0];

        if (!file) {
            return;
        }

        backPreview.src =
            URL.createObjectURL(file);
    }
);


/* ============================================================
   UPLOAD IMAGE
============================================================ */

async function uploadImage(file) {

    if (!file) {
        return null;
    }

    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();

    const fileName =
        `${Date.now()}-${crypto.randomUUID()}.${extension}`;

    const filePath =
        `products/${fileName}`;


    const {
        error
    } = await supabaseClient
        .storage
        .from("product-images")
        .upload(
            filePath,
            file,
            {
                cacheControl: "3600",
                upsert: false
            }
        );

    if (error) {
        throw error;
    }


    const {
        data
    } = supabaseClient
        .storage
        .from("product-images")
        .getPublicUrl(filePath);


    return data.publicUrl;
}


/* ============================================================
   SAVE PRODUCT
============================================================ */

productForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        clearModalError();

        const name =
            productName.value.trim();

        const price =
            Number(productPrice.value);

        const description =
            productDescription.value.trim();


        if (!name) {

            showModalError(
                "Введите название товара."
            );

            return;
        }


        if (!Number.isFinite(price) || price < 0) {

            showModalError(
                "Введите правильную цену."
            );

            return;
        }


        saveProductButton.disabled = true;

        saveProductButton.textContent =
            "СОХРАНЕНИЕ...";


        try {

            let frontImage = null;
            let backImage = null;


            /*
                Если пользователь выбрал новое фото —
                загружаем его.
            */

            if (frontFile.files[0]) {

                frontImage =
                    await uploadImage(
                        frontFile.files[0]
                    );
            }


            if (backFile.files[0]) {

                backImage =
                    await uploadImage(
                        backFile.files[0]
                    );
            }


            /* =========================
               EDIT
            ========================= */

            if (editingProductId) {

                const currentProduct =
                    products.find(
                        item =>
                            String(item.id) ===
                            String(editingProductId)
                    );


                const updateData = {

                    name,

                    price,

                    description

                };


                if (frontImage) {
                    updateData.front_image =
                        frontImage;
                }


                if (backImage) {
                    updateData.back_image =
                        backImage;
                }


                const {
                    error
                } = await supabaseClient
                    .from("products")
                    .update(updateData)
                    .eq(
                        "id",
                        editingProductId
                    );


                if (error) {
                    throw error;
                }


                showToast(
                    "Товар успешно изменён."
                );

            }


            /* =========================
               ADD
            ========================= */

            else {

                /*
                   Новый товар ставим в конец.
                */

                const maxOrder =
                    products.length
                        ? Math.max(
                            ...products.map(
                                item =>
                                    Number(item.sort_order) || 0
                            )
                          )
                        : 0;


                const insertData = {

                    name,

                    price,

                    description,

                    front_image:
                        frontImage || "",

                    back_image:
                        backImage || "",

                    sort_order:
                        maxOrder + 1,

                    is_visible:
                        true

                };


                const {
                    error
                } = await supabaseClient
                    .from("products")
                    .insert(insertData);


                if (error) {
                    throw error;
                }


                showToast(
                    "Товар успешно добавлен."
                );
            }


            closeProductModal();

            await loadProducts();

        }

        catch (error) {

            console.error(error);

            showModalError(
                error.message ||
                "Произошла ошибка."
            );

        }

        finally {

            saveProductButton.disabled = false;

            saveProductButton.textContent =
                "СОХРАНИТЬ";
        }

    }
);


/* ============================================================
   HIDE / SHOW
============================================================ */

window.toggleVisibility =
    async function(id) {

        const product =
            products.find(
                item =>
                    String(item.id) ===
                    String(id)
            );

        if (!product) {
            return;
        }


        const {
            error
        } = await supabaseClient
            .from("products")
            .update({
                is_visible:
                    !product.is_visible
            })
            .eq(
                "id",
                product.id
            );


        if (error) {

            alert(
                "Ошибка: " +
                error.message
            );

            return;
        }


        showToast(
            product.is_visible
                ? "Товар скрыт."
                : "Товар опубликован."
        );


        await loadProducts();
    };


/* ============================================================
   DELETE
============================================================ */

window.deleteProduct =
    async function(id) {

        const product =
            products.find(
                item =>
                    String(item.id) ===
                    String(id)
            );

        if (!product) {
            return;
        }


        const confirmed =
            confirm(
                `Удалить товар "${product.name}"?`
            );


        if (!confirmed) {
            return;
        }


        const {
            error
        } = await supabaseClient
            .from("products")
            .delete()
            .eq(
                "id",
                product.id
            );


        if (error) {

            alert(
                "Ошибка удаления: " +
                error.message
            );

            return;
        }


        showToast(
            "Товар удалён."
        );


        await loadProducts();
    };


/* ============================================================
   CHANGE ORDER
============================================================ */

window.moveProduct =
    async function(id, direction) {

        const index =
            products.findIndex(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if (index === -1) {
            return;
        }


        const newIndex =
            index + direction;


        if (
            newIndex < 0 ||
            newIndex >= products.length
        ) {
            return;
        }


        const current =
            products[index];

        const target =
            products[newIndex];


        const currentOrder =
            current.sort_order;

        const targetOrder =
            target.sort_order;


        /*
           Меняем sort_order местами.
        */

        const firstUpdate =
            await supabaseClient
                .from("products")
                .update({
                    sort_order:
                        targetOrder
                })
                .eq(
                    "id",
                    current.id
                );


        if (firstUpdate.error) {

            alert(
                "Ошибка изменения порядка: " +
                firstUpdate.error.message
            );

            return;
        }


        const secondUpdate =
            await supabaseClient
                .from("products")
                .update({
                    sort_order:
                        currentOrder
                })
                .eq(
                    "id",
                    target.id
                );


        if (secondUpdate.error) {

            alert(
                "Ошибка изменения порядка: " +
                secondUpdate.error.message
            );

            return;
        }


        await loadProducts();

        showToast(
            "Порядок товаров изменён."
        );
    };
